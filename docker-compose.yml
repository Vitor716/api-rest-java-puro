services:
  postgres:
    image: postgres:16-alpine
    container_name: api-clientes-postgres
    environment:
      POSTGRES_DB: api_clientes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d api_clientes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
